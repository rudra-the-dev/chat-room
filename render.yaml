services:
  - type: web
    name: common-room
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false        # your MongoDB Atlas connection string
      - key: MONGODB_DB
        value: commonroom
      - key: ADMIN_KEY
        sync: false        # a long secret only you know; it makes you the site admin
